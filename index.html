<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7468">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<title>Мой магазин</title>
<style>
:root{--bg:#f1f4f1;--card:#fff;--ink:#14201c;--mute:#66736e;--line:#e1e8e3;--brand:#2f7468;--bi:#fff;--good:#2a7d46;--warn:#b4581f;--wb:#f6e6da;--bad:#b3342a;--bb:#f6dcd9;--chip:#e3ebe6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#18231f;--ink:#e8efeb;--mute:#8fa19a;--line:#26342f;--brand:#4aa899;--bi:#06201b;--good:#5fc383;--warn:#e89a5f;--wb:#3a2a1e;--bad:#ef7d72;--bb:#3b1f1c;--chip:#22302b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1714;--card:#18231f;--ink:#e8efeb;--mute:#8fa19a;--line:#26342f;--brand:#4aa899;--bi:#06201b;--good:#5fc383;--warn:#e89a5f;--wb:#3a2a1e;--bad:#ef7d72;--bb:#3b1f1c;--chip:#22302b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{padding-bottom:150px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 6px}
h1{font-size:32px;margin:0;letter-spacing:-.02em}
h2{font-size:15px;color:var(--mute);font-weight:600;margin:22px 4px 8px}
main{padding:0 14px;max-width:640px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer}
input,select{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);outline:0}
input:focus,select:focus{border-color:var(--brand)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 2px 5px}
.ic{background:var(--chip);width:42px;height:42px;border-radius:50%;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin:9px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.card b{font-size:17px;display:block}
.sub{color:var(--mute);font-size:14px}
.g{color:var(--good);font-size:14px}.r{color:var(--bad)}
.pill{padding:9px 14px;border-radius:14px;font-weight:700;background:var(--chip);white-space:nowrap}
.pill.low{background:var(--wb);color:var(--warn)}.pill.zero{background:var(--bb);color:var(--bad)}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--wb);color:var(--warn);margin-left:6px;font-weight:600}
.hero{background:linear-gradient(135deg,#34796d,#25524b);color:#fff;border-radius:26px;padding:20px;margin:10px 0}
.hero .n{font-size:40px;font-weight:800;letter-spacing:-.02em}
.hero .sub{color:#cfe6e0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.k{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 15px}
.k .sub{font-size:13px}.k b{font-size:20px}
.chips{display:flex;gap:8px;margin:6px 0 10px;overflow-x:auto}
.chip{padding:10px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--brand);color:var(--bi);padding:15px;border-radius:16px;font-weight:700;width:100%;margin-top:14px}
.btn.s{background:var(--chip);color:var(--ink)}.btn.d{background:var(--bb);color:var(--bad)}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:7px 14px;border-radius:18px;min-width:74px}
nav button.on{background:var(--brand);color:var(--bi)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;background:var(--brand);color:var(--bi);font-size:32px;box-shadow:0 8px 24px #0004}
#bar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#bar button{width:100%;background:var(--ink);color:var(--bg);padding:15px 18px;border-radius:18px;font-weight:700;display:flex;justify-content:space-between;box-shadow:0 8px 24px #0004}
#ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
#ov.on{display:flex}
.panel{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.panel h3{margin:0 0 4px;font-size:22px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.q{display:flex;align-items:center;gap:10px}.q button{width:34px;height:34px;border-radius:50%;background:var(--chip);font-size:20px}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px}.seg button{flex:1;padding:10px;border-radius:11px;background:none}.seg .on{background:var(--card);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--brand);border-radius:8px 8px 3px 3px;min-height:3px;margin-bottom:4px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:20;display:none;max-width:90%}
textarea{width:100%;height:120px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font:12px monospace}
a.btn{display:block;text-align:center;text-decoration:none}
@media print{nav,.fab,#bar,header button,.chips{display:none}}
</style></head><body>
<header><h1 id="ti"></h1><button class="ic" onclick="theme()" aria-label="Тема">◐</button></header>
<main id="main"></main><div id="bar"></div>
<button class="fab" id="fab" onclick="fabGo()" aria-label="Добавить">+</button>
<nav id="nav"></nav><div id="ov" onclick="if(event.target===this)closeS()"></div><div id="toast"></div>
<script>
const K='shop_v1';let db=null;
try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=Object.assign({products:[],sales:[],clients:[],payments:[],debts:[],expenses:[],cur:'смн'},db||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Не удалось сохранить данные в браузере')}};try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{v=parseFloat(String(v).replace(',','.'));return isNaN(v)?0:v};
const money=n=>Math.round(n).toLocaleString('ru-RU')+' '+db.cur;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dt=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const val=i=>($(i)||{}).value||'';
let tab='p',q='',cart=[],per='all',cs={disc:'',name:'',paid:'',m:'cash',dt:'sum'};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
function theme(){let c=localStorage.getItem('th')||'auto',n={auto:'dark',dark:'light',light:'auto'}[c];try{localStorage.setItem('th',n)}catch(e){}applyTheme();toast('Тема: '+{auto:'авто',dark:'тёмная',light:'светлая'}[n])}
function applyTheme(){let c='auto';try{c=localStorage.getItem('th')||'auto'}catch(e){}c==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=c}
applyTheme();
const IC={p:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/>',s:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h11l2-8H6"/>',d:'<path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2zM4 7l12-3v3"/>',t:'<path d="M6 20V11M12 20V4M18 20v-6"/>'};
const NAMES={p:'Товары',s:'Продажа',d:'Долги',t:'Итоги'};
function go(t){tab=t;q='';render()}
function fabGo(){tab==='p'?editP():addClient()}
function stock(p){return p.qty<=0?'zero':p.qty<=(p.min??3)?'low':''}
function expTag(p){if(!p.exp)return'';const d=Math.ceil((new Date(p.exp)-Date.now())/864e5);return d<=0?'<span class="tag">просрочен</span>':d<=60?`<span class="tag">срок ${d} дн</span>`:''}
function debtOf(id){return Math.max(0,db.sales.filter(s=>s.cid===id).reduce((a,s)=>a+s.total-s.paid,0)+db.debts.filter(p=>p.cid===id).reduce((a,p)=>a+p.amt,0)-db.payments.filter(p=>p.cid===id).reduce((a,p)=>a+p.amt,0))}
const profitOf=s=>s.items.reduce((a,i)=>a+(i.price-i.cost)*i.q,0)-(s.disc||0);
function range(){const n=new Date();n.setHours(0,0,0,0);return per==='today'?n.getTime():per==='7'?n.getTime()-6*864e5:0}

function render(){
 $('ti').textContent=NAMES[tab];
 $('nav').innerHTML=Object.keys(NAMES).map(k=>`<button class="${k===tab?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg>${NAMES[k]}</button>`).join('');
 $('fab').style.display=(tab==='p'||tab==='d')?'block':'none';
 const ph={p:'Поиск по названию',s:'Что продаём?',d:'Поиск по имени'}[tab];
 $('main').innerHTML=tab==='t'?vTotals():(tab==='d'?vDebtHead():'')+`<input id="sq" placeholder="${ph}" value="${esc(q)}" oninput="q=this.value;fill()"><div id="list"></div>`;
 if(tab!=='t')fill();
 const n=cart.reduce((a,c)=>a+c.q,0);
 $('bar').innerHTML=n&&tab==='s'?`<button onclick="openCart()"><span>Корзина · ${n} шт</span><span>${money(cartSum())}</span></button>`:'';
}
function fill(){const l=$('list');if(!l)return;const s=q.toLowerCase();
 if(tab==='p'){const a=db.products.filter(p=>p.name.toLowerCase().includes(s));l.innerHTML=a.length?a.map(p=>`<button class="card" onclick="editP('${p.id}')"><div><b>${esc(p.name)}${expTag(p)}</b><div class="sub">Закупка ${money(p.cost)}, цена ${money(p.price)}</div><div class="g">Прибыль ${money(p.price-p.cost)} с шт.</div></div><span class="pill ${stock(p)}">${p.qty} шт</span></button>`).join(''):'<div class="empty">Товаров пока нет.<br>Нажмите «+», чтобы добавить первый.</div>'}
 if(tab==='s'){const a=db.products.filter(p=>p.name.toLowerCase().includes(s)).sort((a,b)=>(b.qty>0)-(a.qty>0));l.innerHTML=a.length?a.map(p=>{const c=cart.find(x=>x.pid===p.id);return`<button class="card" onclick="addCart('${p.id}')"><div><b>${esc(p.name)}</b><div class="sub">${money(p.price)}</div><div class="g">Прибыль ${money(p.price-p.cost)}</div></div><span class="pill ${stock(p)}">${c?c.q+' / ':''}${p.qty} шт</span></button>`}).join(''):'<div class="empty">Нет товаров. Добавьте их на вкладке «Товары».</div>'}
 if(tab==='d'){const a=db.clients.filter(c=>c.name.toLowerCase().includes(s)).map(c=>({c,d:debtOf(c.id)})).sort((a,b)=>b.d-a.d);l.innerHTML=a.length?a.map(({c,d})=>{const old=d>0?ageOf(c.id):0;return`<button class="card" onclick="openClient('${c.id}')"><div style="display:flex;gap:12px;align-items:center"><span class="ic" style="display:grid;place-items:center;font-weight:700">${esc(c.name[0]||'?').toUpperCase()}</span><div><b>${esc(c.name)}</b><div class="sub ${old>14?'r':''}">${d>0?(old>0?'Долг '+old+' дн.':'Ждёт оплаты'):'Долгов нет'}</div></div></div>${d>0?`<span class="pill low">${money(d)}</span>`:''}</button>`}).join(''):'<div class="empty">Клиентов пока нет. Они появятся при продаже в долг.</div>'}
}
/* products */
function editP(id){const p=db.products.find(x=>x.id===id)||{name:'',cost:'',price:'',qty:'',min:3,exp:''};
 sheet(`<h3>${id?'Товар':'Новый товар'}</h3><label>Название</label><input id="f1" value="${esc(p.name)}"><div class="row"><div><label>Закупка</label><input id="f2" inputmode="decimal" value="${p.cost}"></div><div><label>Цена продажи</label><input id="f3" inputmode="decimal" value="${p.price}"></div></div><div class="row"><div><label>Остаток, шт</label><input id="f4" inputmode="numeric" value="${p.qty}"></div><div><label>Сигнал при остатке</label><input id="f5" inputmode="numeric" value="${p.min??3}"></div></div><label>Срок годности (необязательно)</label><input id="f6" type="date" value="${p.exp||''}"><button class="btn" onclick="saveP('${id||''}')">Сохранить</button>${id?`<button class="btn d" onclick="delP('${id}')">Удалить товар</button>`:''}`)}
function saveP(id){const n=val('f1').trim();if(!n)return toast('Введите название');const o={name:n,cost:num(val('f2')),price:num(val('f3')),qty:Math.max(0,Math.floor(num(val('f4')))),min:Math.floor(num(val('f5'))),exp:val('f6')};
 if(id)Object.assign(db.products.find(x=>x.id===id),o);else db.products.unshift({id:uid(),...o});save();closeS();render();toast('Сохранено')}
function delP(id){ask('Удалить товар? Продажи в истории останутся.',()=>delP2(id))}function delP2(id){closeS();db.products=db.products.filter(x=>x.id!==id);cart=cart.filter(c=>c.pid!==id);save();closeS();render()}
/* cart */
const cartSum=()=>cart.reduce((a,c)=>{const p=db.products.find(x=>x.id===c.pid);return a+(p?p.price*c.q:0)},0);
function addCart(id){const p=db.products.find(x=>x.id===id),c=cart.find(x=>x.pid===id);if(!p||p.qty<=0)return toast('Нет в наличии');if(c){if(c.q>=p.qty)return toast('Больше нет на складе');c.q++}else cart.push({pid:id,q:1});render()}
function chQ(id,d){const c=cart.find(x=>x.pid===id),p=db.products.find(x=>x.id===id);c.q+=d;if(c.q>p.qty){c.q=p.qty;toast('Больше нет на складе')}if(c.q<=0)cart=cart.filter(x=>x!==c);cart.length?openCart():closeS();render()}
function syncCart(){if($('dc'))cs.disc=val('dc');if($('cn'))cs.name=val('cn');if($('cp'))cs.paid=val('cp')}
function calcDisc(){const s=cartSum(),v=Math.max(0,num(cs.disc));return Math.round(Math.min(s,cs.dt==='pct'?s*Math.min(v,100)/100:v)*100)/100}
function pickC(id){syncCart();cs.name=db.clients.find(x=>x.id===id).name;openCart()}
function setD(t,v){syncCart();cs.dt=t;if(v!=null)cs.disc=String(v);openCart()}
function openCart(){
 const chips=db.clients.slice(-8).reverse().map(c=>`<button class="chip ${cs.name.trim().toLowerCase()===c.name.toLowerCase()?'on':''}" onclick="pickC('${c.id}')">${esc(c.name)}</button>`).join('');
 sheet(`<h3>Чек</h3>${cart.map(c=>{const p=db.products.find(x=>x.id===c.pid);return`<div class="line"><div><b style="font-size:16px">${esc(p.name)}</b><div class="sub">${money(p.price)}</div></div><div class="q"><button onclick="syncCart();chQ('${p.id}',-1)">−</button><b>${c.q}</b><button onclick="syncCart();chQ('${p.id}',1)">+</button></div></div>`}).join('')}
 <label>Скидка</label><div class="row"><input id="dc" inputmode="decimal" placeholder="Например 5 или 10" value="${esc(cs.disc)}" oninput="cs.disc=this.value;tot()"><div class="seg" style="flex:.8"><button class="${cs.dt==='sum'?'on':''}" onclick="setD('sum')">${esc(db.cur)}</button><button class="${cs.dt==='pct'?'on':''}" onclick="setD('pct')">%</button></div></div>
 <div class="chips" style="margin:8px 0 0">${[5,10,15,20].map(n=>`<button class="chip" onclick="setD('pct',${n})">${n}%</button>`).join('')}</div>
 <label>Оплата</label><div class="seg">${[['cash','Наличные'],['card','Перевод'],['debt','В долг']].map(([k,v])=>`<button class="${cs.m===k?'on':''}" onclick="syncCart();cs.m='${k}';openCart()">${v}</button>`).join('')}</div>
 <label>Клиент${cs.m==='debt'?' (обязательно)':' (необязательно)'}</label><input id="cn" list="cl" placeholder="Имя клиента" value="${esc(cs.name)}" oninput="cs.name=this.value" onchange="cs.name=this.value"><datalist id="cl">${db.clients.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
 ${chips?`<div class="chips" style="margin:8px 0 0">${chips}</div>`:''}
 ${cs.m==='debt'?`<label>Клиент заплатил сейчас (если ничего, оставьте пустым)</label><input id="cp" inputmode="decimal" placeholder="0" value="${esc(cs.paid)}" oninput="cs.paid=this.value;tot()">`:''}
 <div class="line" style="border:0;padding-bottom:0"><span class="sub">Сумма</span><span id="sm"></span></div><div class="line" style="border:0;padding:4px 0"><span class="sub">Скидка</span><span id="ds"></span></div>
 <div class="line" style="border:0"><span class="sub">Итого</span><b id="tt" style="font-size:24px"></b></div>${cs.m==='debt'?'<div class="line" style="border:0;padding-top:0"><span class="sub">Запишется в долг</span><b id="dl" class="r"></b></div>':''}<button class="btn" onclick="checkout()">Продать</button>`);tot()}
function tot(){const s=cartSum(),d=calcDisc();if($('sm'))$('sm').textContent=money(s);if($('ds'))$('ds').textContent=d?'− '+money(d)+(cs.dt==='pct'?' ('+num(cs.disc)+'%)':''):'—';if($('tt'))$('tt').textContent=money(s-d);if($('dl'))$('dl').textContent=money(Math.max(0,s-d-Math.max(0,num(cs.paid))))}
function checkout(){syncCart();if(!cart.length)return;const sum=cartSum(),disc=calcDisc(),total=sum-disc,nm=cs.name.trim();
 if(cs.m==='debt'&&!nm)return toast('Укажите клиента для долга');
 for(const c of cart){const p=db.products.find(x=>x.id===c.pid);if(!p||p.qty<c.q)return toast('Не хватает на складе: '+(p?p.name:'товар удалён'))}
 let cid=null;if(nm){let c=db.clients.find(x=>normName(x.name)===normName(nm));if(!c){c={id:uid(),name:nm,phone:''};db.clients.push(c)}cid=c.id}
 const items=cart.map(c=>{const p=db.products.find(x=>x.id===c.pid);p.qty-=c.q;return{pid:p.id,name:p.name,q:c.q,price:p.price,cost:p.cost}});
 const paid=cs.m==='debt'?Math.min(Math.max(num(cs.paid),0),total):total;
 db.sales.unshift({id:uid(),t:Date.now(),items,disc,dp:disc>0&&cs.dt==='pct'?Math.min(100,num(cs.disc)):0,total,paid,cid,m:cs.m});save();const note=cs.m==='debt'?'. Долг '+nm+': '+money(debtOf(cid)):'';cart=[];cs={disc:'',name:'',paid:'',m:'cash',dt:'sum'};closeS();render();toast('Продано на '+money(total)+note)}
/* clients & debts */
const LAT={a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',k:'к',m:'м',h:'н',t:'т',y:'у',b:'в'};
const normName=n=>String(n).toLowerCase().replace(/[^a-zа-яёғӣқӯҳҷ]/g,'').replace(/[a-z]/g,c=>LAT[c]||c);
function mergeDup(){const seen={};let ch=0;db.clients=db.clients.filter(c=>{const k=normName(c.name);if(!k)return true;const f=seen[k];if(!f){seen[k]=c;return true}if(!f.phone&&c.phone)f.phone=c.phone;['sales','debts','payments'].forEach(t=>db[t].forEach(x=>{if(x.cid===c.id)x.cid=f.id}));ch++;return false});if(ch)save()}
const ageOf=id=>{const a=[...db.sales.filter(s=>s.cid===id&&s.total>s.paid).map(s=>s.t),...db.debts.filter(x=>x.cid===id).map(x=>x.t)];return a.length?Math.floor((Date.now()-Math.min(...a))/864e5):0};
